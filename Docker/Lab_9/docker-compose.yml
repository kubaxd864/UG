version: "3.9"

services:
  nginx:
    image: nginx:latest
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started
    networks:
      - proxy-net
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf

  adminer:
    image: adminer
    profiles: ["debug"]
    networks:
      - db-net

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["debug"]
    networks:
      - db-net

  db-migrator:
    image: alpine
    profiles: ["migrate"]
    command: ["sh", "-c", "echo running migrations"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://nginx/api
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started
    networks:
      - proxy-net
    expose:
      - "3000"

  backend_1:
    build:
      context: ./backend
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      - BACKEND_PORT=5000
      - POSTGRES_DB=${POSTGRES_DB?POSTGRES_DB not set}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-net
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    configs:
      - source: backend_config
        target: /app/app.config.json

  backend_2:
    build:
      context: ./backend
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      - BACKEND_PORT=5001
      - POSTGRES_DB=${POSTGRES_DB?POSTGRES_DB not set}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-net
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    configs:
      - source: backend_config
        target: /app/app.config.json

  worker:
    build:
      context: ./worker
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      - POSTGRES_DB=${POSTGRES_DB?POSTGRES_DB not set}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    configs:
      - source: backend_config
        target: /app/app.config.json

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB?POSTGRES_DB not set}
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_user)"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

configs:
  nginx_conf:
    file: ./nginx/nginx.conf
  backend_config:
    file: ./backend/app.config.json

volumes:
  postgres-data:
  redis-data:

networks:
  proxy-net:
  app-net:
  db-net:
