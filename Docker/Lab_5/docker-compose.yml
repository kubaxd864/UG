services:
  backend:
    build: ./backend
    container_name: product-backend
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: product-frontend
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      - backend
    restart: unless-stopped

networks:
  internal:
    driver: bridge
